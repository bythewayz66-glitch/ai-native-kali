set default=0

# Headless-first boot.
#
# The stock live-build config switched the terminal to gfxterm and never set a
# timeout, so on a machine with no local display - QEMU -nographic, a BMC, a KVM
# serial console, any server we actually target - GRUB drew a menu nobody could
# see and then waited forever: the console showed nothing after the firmware's
# own messages and the box never booted. It also insmod'd efi_uga, which the Kali
# GRUB module set does not ship, so the graphical path aborted with
# "file `/boot/grub/x86_64-efi/efi_uga.mod' not found" before the menu even ran.
#
# This config makes the serial console the primary terminal and auto-boots after
# 10 seconds, and it loads only modules the image actually contains.
set timeout=10

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

# Serial first: module set provides `serial`, and the kernel cmdline carries
# console=ttyS0,115200n8, so the menu is readable over serial from the start.
insmod serial
serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial
echo "AI-native Kali (Mem20kaliai 1.0 rc1): serial console ready, auto-boot in 10s"

# Graphics stays optional. If the font and a GOP framebuffer are available we
# load the pieces for the graphical menu, but we do NOT switch the output to
# gfxterm - a headless host must never lose the menu it can actually read.
if loadfont $font ; then
    set gfxmode=auto
    set gfxpayload=keep
    insmod efi_gop
    insmod all_video
    insmod gfxterm
    insmod png
else
    set gfxmode=auto
    insmod all_video
fi

source /boot/grub/theme.cfg
