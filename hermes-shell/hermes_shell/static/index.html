<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Shell - AI-native Kali</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#111820; --panel-2:#0e141b; --line:#1e2a36;
    --txt:#d7e3ee; --txt-dim:#8b9cb0; --acc:#31d0aa; --acc-2:#4aa3ff;
    --warn:#e8b552; --bad:#ff6b6b; --ok:#3ecf8e; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:13px;line-height:1.5}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel-2);position:sticky;top:0;z-index:20}
  header h1{font-size:13px;margin:0;letter-spacing:.14em;text-transform:uppercase;color:var(--acc)}
  header .sub{color:var(--txt-dim);font-size:11px}
  .dots{margin-left:auto;display:flex;gap:12px;align-items:center;font-size:11px;color:var(--txt-dim)}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--txt-dim);display:inline-block;margin-right:5px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  .layout{display:grid;grid-template-columns:1fr 320px;gap:14px;padding:14px 16px 84px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:12px 14px}
  .panel h2{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim);margin:0 0 10px}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .tab{padding:5px 11px;border:1px solid var(--line);border-radius:4px;background:var(--panel-2);color:var(--txt-dim);cursor:pointer;font-size:11.5px}
  .tab.active{border-color:var(--acc);color:var(--acc);background:#0f1c1a}
  .board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
  .col{background:var(--panel-2);border:1px solid var(--line);border-radius:6px;min-height:180px;display:flex;flex-direction:column}
  .col-head{padding:8px 10px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-dim);display:flex;justify-content:space-between}
  .col-head .n{color:var(--acc)}
  .col-body{padding:8px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:60vh}
  .card{background:#131c26;border:1px solid var(--line);border-left:3px solid var(--txt-dim);border-radius:4px;padding:8px 9px;cursor:pointer}
  .card:hover{border-color:var(--acc-2)}
  .card.p-high{border-left-color:var(--bad)} .card.p-critical{border-left-color:#ff3b3b}
  .card.p-medium{border-left-color:var(--warn)} .card.p-low{border-left-color:var(--acc)}
  .card .t{font-size:12px;color:var(--txt);margin-bottom:4px}
  .card .m{font-size:10.5px;color:var(--txt-dim);display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);border-radius:3px;padding:0 5px;font-size:10px}
  .chip.t2{color:var(--warn);border-color:#5a4a22} .chip.t3{color:var(--bad);border-color:#5d2b2b}
  .chip.gate{color:var(--acc-2);border-color:#25476b}
  .feed{max-height:70vh;overflow-y:auto;display:flex;flex-direction:column;gap:7px}
  .note{border:1px solid var(--line);border-left:3px solid var(--acc-2);border-radius:4px;padding:7px 9px;font-size:11px;background:var(--panel-2)}
  .note.blocked{border-left-color:var(--bad)} .note.done{border-left-color:var(--ok)} .note.gate{border-left-color:var(--warn)}
  .note .ts{color:var(--txt-dim);font-size:10px}
  .taskbar{position:fixed;bottom:0;left:0;right:0;background:var(--panel-2);border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;padding:9px 16px;font-size:11.5px;z-index:30}
  .taskbar .stat{display:flex;gap:6px;align-items:center}
  .taskbar .stat b{color:var(--acc);font-weight:600}
  .taskbar .quick{margin-left:auto;display:flex;gap:8px}
  .taskbar input{background:var(--bg);border:1px solid var(--line);color:var(--txt);padding:5px 9px;border-radius:4px;font-family:var(--mono);font-size:11.5px;width:300px}
  button{font-family:var(--mono);font-size:11.5px;background:#132029;border:1px solid var(--line);color:var(--txt);padding:5px 11px;border-radius:4px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.approve:hover{border-color:var(--ok);color:var(--ok)} button.reject:hover{border-color:var(--bad);color:var(--bad)}
  .drawer{position:fixed;top:0;right:-560px;width:560px;max-width:94vw;height:100%;background:var(--panel-2);border-left:1px solid var(--line);z-index:40;transition:right .16s;display:flex;flex-direction:column}
  .drawer.open{right:0}
  .drawer-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
  .drawer-head h3{margin:0;font-size:12.5px;flex:1}
  .drawer-body{padding:14px 16px;overflow-y:auto}
  .kv{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;font-size:11.5px;margin-bottom:12px}
  .kv dt{color:var(--txt-dim)} .kv dd{margin:0;word-break:break-word}
  .trace{border:1px solid var(--line);border-left:3px solid var(--txt-dim);border-radius:4px;padding:7px 9px;margin-bottom:6px;font-size:11px}
  .trace.ok{border-left-color:var(--ok)} .trace.denied,.trace.error{border-left-color:var(--bad)}
  .trace.blocked{border-left-color:var(--warn)}
  pre{background:#0a0e13;border:1px solid var(--line);border-radius:4px;padding:9px;font-size:10.5px;overflow-x:auto;color:var(--txt-dim);margin:6px 0}
  .muted{color:var(--txt-dim);font-size:11px}
  /* ---- Phase 4: overlay widget ----
     Anchored bottom-right rather than top-right. Pinned at the top it sat on top
     of the notification feed - the very surface it is meant to complement - and
     because the feed scrolls, entries passed *under* it and were unreadable. At
     the bottom it overlays only page margin, and the toasts sit beside it. */
  .overlay{position:fixed;bottom:64px;right:16px;width:310px;background:rgba(11,15,20,.95);border:1px solid var(--line);border-radius:8px;padding:10px 12px;z-index:35}
  .overlay.alert{border-color:#5d2b2b}.overlay.warn{border-color:#5a4a22}
  .ov-head{display:flex;align-items:center;gap:7px;font-size:11.5px;margin-bottom:7px}
  .ov-head b{font-weight:600}
  .ov-counters{display:flex;flex-wrap:wrap;gap:9px;font-size:10.5px;color:var(--txt-dim)}
  .ov-counters b{color:var(--acc)}
  .ov-alert{font-size:10.5px;margin-top:6px;padding:4px 6px;border-radius:3px;border:1px solid var(--line)}
  .ov-alert.alert{color:#ff9a9a;border-color:#5d2b2b}.ov-alert.warn{color:var(--warn);border-color:#5a4a22}
  /* ---- Phase 4: file manager + drop ---- */
  .fm{display:flex;flex-direction:column;gap:5px}
  .fmentry{border:1px solid var(--line);border-radius:4px;padding:5px 7px;font-size:11px;cursor:grab;background:var(--panel-2)}
  .fmentry:active{cursor:grabbing}
  .card.drop{border-color:var(--acc);background:#12211f}
  /* ---- Phase 4: window manager ---- */
  .desktop{position:relative;height:240px;border:1px solid var(--line);border-radius:6px;background:#090d12;overflow:hidden;margin-top:12px}
  .win{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:5px;display:flex;flex-direction:column;box-shadow:0 6px 22px rgba(0,0,0,.45);overflow:hidden}
  .win.focused{border-color:var(--acc)}
  .win-bar{display:flex;align-items:center;gap:6px;padding:4px 7px;background:var(--panel-2);border-bottom:1px solid var(--line);cursor:move;font-size:10.5px;color:var(--txt-dim)}
  .win-bar .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
  .win-btn{width:15px;height:15px;line-height:13px;text-align:center;border:1px solid var(--line);border-radius:3px;font-size:9px;cursor:pointer}
  .win-btn:hover{border-color:var(--acc);color:var(--acc)}
  .win-body{padding:8px;font-size:10.5px;color:var(--txt-dim);flex:1;overflow:auto}
  .wins{display:flex;gap:6px;align-items:center;max-width:36vw;overflow-x:auto}
  .winbtn{border:1px solid var(--line);border-radius:3px;padding:1px 7px;font-size:10.5px;color:var(--txt-dim);cursor:pointer;white-space:nowrap}
  .winbtn.active{border-color:var(--acc);color:var(--acc)}
  .toasts{position:fixed;bottom:64px;right:16px;display:flex;flex-direction:column;gap:6px;z-index:45}
  .toast{font-size:11px;padding:6px 10px;border-radius:4px;border:1px solid var(--line);background:var(--panel-2)}
  .toast.ok{border-color:#245c46;color:var(--ok)}.toast.bad{border-color:#5d2b2b;color:#ff9a9a}
</style>
</head>
<body>
<header>
  <h1>Hermes Shell</h1>
  <span class="sub">AI-native Kali &middot; Kanban orchestration surface</span>
  <div class="dots" id="health"></div>
</header>

<div class="layout">
  <main>
    <div class="panel">
      <h2>Boards</h2>
      <div class="tabs" id="tabs"></div>
      <div class="board" id="board"></div>
    </div>
  </main>

  <aside class="panel">
    <h2>Notification feed &amp; gates</h2>
    <div class="feed" id="feed"><div class="muted">waiting for events...</div></div>
    <h2 style="margin-top:14px">File manager</h2>
    <div class="fm" id="fm"></div>
    <div class="muted" style="margin-top:6px">drag an entry onto a card to attach it</div>
  </aside>
</div>

<div class="overlay ok" id="overlay"><div class="muted">overlay starting...</div></div>
<div class="toasts" id="toasts"></div>

<div class="panel" style="margin:0 16px 84px">
  <h2>Desktop &mdash; window manager</h2>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button data-new="kanban">kanban window</button>
    <button data-new="file-manager">file manager</button>
    <button data-new="observability">observability</button>
    <button data-new="terminal">terminal</button>
  </div>
  <div class="desktop" id="desktop"></div>
</div>

<div class="taskbar">
  <div class="stat"><span class="dot ok"></span>cards <b id="s-cards">0</b></div>
  <div class="stat">running <b id="s-running">0</b></div>
  <div class="stat">blocked <b id="s-blocked">0</b></div>
  <div class="stat">gates <b id="s-gates">0</b></div>
  <div class="stat">tool runs <b id="s-traces">0</b></div>
  <div class="wins" id="wins"></div>
  <div class="quick">
    <input id="quick-title" placeholder="new task -> agent board backlog">
    <button id="quick-add">add card</button>
  </div>
</div>

<div class="drawer" id="drawer">
  <div class="drawer-head">
    <h3 id="d-title">card</h3>
    <button id="d-close">close</button>
  </div>
  <div class="drawer-body" id="d-body"></div>
</div>

<script>
const CFG = { kanban_url: location.origin, runtime_url: location.origin, tools_url: location.origin, observability_url: location.origin, poll_ms: 3000 };
const COLS = ['Backlog','Assigned','Running','Review','Blocked','Done'];
let state = { boards: [], boardId: null, cards: [], events: [], pending: [], config: null };

async function fetchConfig(){
  try { const r = await fetch('/config'); if (r.ok) Object.assign(CFG, await r.json()); } catch(e){}
}
async function api(url, opts){
  const r = await fetch(url, opts);
  if(!r.ok) throw new Error(url+' -> '+r.status);
  return r.json();
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function el(id){ return document.getElementById(id); }

async function pollHealth(){
  const targets = [
    ['kanban', CFG.kanban_url+'/health'],
    ['runtime', CFG.runtime_url+'/health'],
    ['tools', CFG.tools_url+'/health'],
    ['obs', CFG.observability_url+'/health'],
  ];
  const out = [];
  for (const [name, url] of targets){
    let ok = false; try { const r = await fetch(url); ok = r.ok; } catch(e){ ok = false; }
    out.push(`<span><span class="dot ${ok?'ok':'bad'}"></span>${name}</span>`);
  }
  el('health').innerHTML = out.join('');
}

async function loadBoards(){
  const d = await api(CFG.kanban_url+'/api/boards');
  state.boards = d.boards || [];
  if (!state.boardId && state.boards.length) state.boardId = state.boards[0].board_id;
  el('tabs').innerHTML = state.boards.map(b =>
    `<div class="tab ${b.board_id===state.boardId?'active':''}" data-board="${esc(b.board_id)}">${esc(b.name)}</div>`).join('');
  document.querySelectorAll('.tab').forEach(t => t.onclick = () => { state.boardId = t.dataset.board; loadBoard(); loadBoards(); });
}

async function loadBoard(){
  if(!state.boardId) return;
  const d = await api(`${CFG.kanban_url}/api/cards?board_id=${encodeURIComponent(state.boardId)}&limit=500`);
  state.cards = d.cards || [];
  el('board').innerHTML = COLS.map(col => {
    const cards = state.cards.filter(c => c.column === col);
    const body = cards.map(c => cardHtml(c)).join('') || '<div class="muted">empty</div>';
    return `<div class="col"><div class="col-head"><span>${col}</span><span class="n">${cards.length}</span></div><div class="col-body">${body}</div></div>`;
  }).join('');
  document.querySelectorAll('.card').forEach(node => node.onclick = () => openDrawer(node.dataset.card));
  wireDrops();
}

function cardHtml(c){
  const tier = (c.tools||[]).reduce((m,t)=>Math.max(m, t.tier||0), 0);
  const bits = [];
  if (c.assignee) bits.push(`<span class="chip">${esc(c.assignee)}</span>`);
  if (c.crew) bits.push(`<span class="chip">crew:${esc(c.crew)}</span>`);
  if (tier) bits.push(`<span class="chip t${tier}">T${tier}</span>`);
  if (c.pending_approval) bits.push('<span class="chip gate">gate</span>');
  if ((c.traces||[]).length) bits.push(`<span class="chip">${c.traces.length} traces</span>`);
  return `<div class="card p-${esc(c.priority)}" data-card="${esc(c.card_id)}" data-drop-card="${esc(c.card_id)}">
    <div class="t">${esc(c.title)}</div><div class="m">${bits.join('')}</div></div>`;
}

async function loadOverview(){
  const d = await api(CFG.kanban_url+'/api/overview');
  const t = d.totals || {};
  el('s-cards').textContent = t.cards ?? 0;
  el('s-running').textContent = t.running ?? 0;
  el('s-blocked').textContent = t.blocked ?? 0;
  el('s-gates').textContent = t.pending_approvals ?? 0;
  el('s-traces').textContent = t.tool_runs ?? 0;
}

async function loadFeed(){
  const [events, pending] = await Promise.all([
    api(CFG.kanban_url+'/api/events?limit=40'),
    api(CFG.kanban_url+'/api/approvals/pending').catch(()=>({pending:[]})),
  ]);
  state.events = events.events || [];
  state.pending = pending.pending || [];
  const items = [];
  for (const p of state.pending){
    items.push(`<div class="note gate"><div>${esc((p.card&&p.card.title)||p.card_id)} needs approval</div>
      <div class="ts">${esc(p.approval.requested_by)} &middot; ${esc(p.approval.reason)}</div>
      <div style="margin-top:6px;display:flex;gap:6px">
        <button class="approve" data-approve="${esc(p.card_id)}" data-approval="${esc(p.approval.id)}">approve</button>
        <button class="reject" data-reject="${esc(p.card_id)}" data-approval="${esc(p.approval.id)}">reject</button>
      </div></div>`);
  }
  for (const e of state.events.slice(0, 30)){
    const cls = e.type === 'card.blocked' ? 'blocked' : (e.type === 'card.moved' && e.to_column === 'Done' ? 'done' : '');
    const move = e.from_column ? `${esc(e.from_column)} &rarr; ${esc(e.to_column)}` : esc(e.type);
    items.push(`<div class="note ${cls}"><div>${esc(e.card_id)} &middot; ${move}</div>
      <div class="ts">${esc(e.actor)} &middot; ${esc((e.ts||'').slice(11,19))}</div></div>`);
  }
  el('feed').innerHTML = items.join('') || '<div class="muted">no activity yet</div>';
  document.querySelectorAll('[data-approve]').forEach(b => b.onclick = () => decide(b.dataset.approve, b.dataset.approval, true));
  document.querySelectorAll('[data-reject]').forEach(b => b.onclick = () => decide(b.dataset.reject, b.dataset.approval, false));
}

async function decide(cardId, approvalId, approved){
  await fetch(`${CFG.kanban_url}/api/cards/${cardId}/approvals/${approvalId}/decide`, {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ approved, decided_by:'operator', note: approved?'approved from shell':'rejected from shell' })
  });
  await refresh();
}

async function openDrawer(cardId){
  const c = await api(`${CFG.kanban_url}/api/cards/${cardId}`);
  el('d-title').textContent = c.title;
  const repl = await api(`${CFG.kanban_url}/api/cards/${cardId}/replay`).catch(()=>({steps:[]}));
  const traces = (c.traces||[]).map(t =>
    `<div class="trace ${esc(t.status)}"><b>${esc(t.tool)}</b> <span class="muted">T${t.tier} &middot; ${esc(t.status)} &middot; ${t.duration_ms}ms${t.dry_run?' &middot; dry-run':''}</span>
     ${t.agent?`<div class="muted">agent: ${esc(t.agent)}</div>`:''}
     ${t.audit_hash?`<div class="muted">audit: ${esc(t.audit_hash.slice(0,24))}...</div>`:''}</div>`).join('') || '<div class="muted">no tool calls recorded</div>';
  const arts = (c.artifacts||[]).map(a => `<div class="trace"><b>${esc(a.name)}</b> <span class="muted">${esc(a.kind)}</span></div>`).join('') || '<div class="muted">none</div>';
  const gates = (c.approvals||[]).map(a => `<div class="trace ${a.status==='approved'?'ok':(a.status==='rejected'?'error':'blocked')}"><b>${esc(a.status)}</b> <span class="muted">${esc(a.requested_by)}</span><div class="muted">${esc(a.reason)}</div></div>`).join('') || '<div class="muted">no gates</div>';
  el('d-body').innerHTML = `
    <dl class="kv">
      <dt>card</dt><dd>${esc(c.card_id)}</dd>
      <dt>column</dt><dd>${esc(c.column)}</dd>
      <dt>assignee</dt><dd>${esc(c.assignee||'-')} (${esc(c.assignee_kind)})</dd>
      <dt>crew</dt><dd>${esc(c.crew||'-')}</dd>
      <dt>priority</dt><dd>${esc(c.priority)}</dd>
      <dt>scope</dt><dd>${esc(c.scope ? ((c.scope.targets||[]).join(', ')+' ['+(c.scope.authorization_ref||'no ref')+']') : 'none')}</dd>
      <dt>blocked</dt><dd>${esc(c.blocked_reason||'-')}</dd>
    </dl>
    <h2 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)">result</h2>
    <pre>${esc(c.result||'(no result yet)')}</pre>
    <h2 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)">tool calls (${(c.traces||[]).length})</h2>${traces}
    <h2 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)">artifacts (${(c.artifacts||[]).length})</h2>${arts}
    <h2 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)">approvals</h2>${gates}
    <h2 style="font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-dim)">replay (${repl.count||0} steps)</h2>
    <pre>${esc((repl.steps||[]).map(s=>`${(s.ts||'').slice(11,19)} [${s.kind}] ${s.type||s.tool||''} ${s.to_column||''}`).join('\n'))}</pre>`;
  el('drawer').classList.add('open');
}

// ============================================================ Phase 4
// File manager: the entries a user can drag onto a card. Populated from the
// board's own artifacts plus a few synthetic working files, because the
// scaffold has no real filesystem browser yet.
function loadFileManager(){
  const entries = [
    { name:'nmap-baseline.xml', path:'/home/operator/loot/nmap-baseline.xml', size:184320 },
    { name:'capture.pcap',      path:'/home/operator/loot/capture.pcap',      size:2097152 },
    { name:'findings.md',       path:'/home/operator/notes/findings.md',      size:4096 },
    { name:'web-headers.json',  path:'/home/operator/loot/web-headers.json',  size:8192 },
  ];
  el('fm').innerHTML = entries.map((f,i) =>
    `<div class="fmentry" draggable="true" data-fm="${i}" data-name="${esc(f.name)}"
          data-path="${esc(f.path)}" data-size="${f.size}">${esc(f.name)}
          <span class="muted">${Math.round(f.size/1024)}K</span></div>`).join('');
  document.querySelectorAll('.fmentry').forEach(n => {
    n.ondragstart = ev => {
      const payload = { name:n.dataset.name, path:n.dataset.path, size:Number(n.dataset.size) };
      ev.dataTransfer.setData('text/hermes-path', JSON.stringify(payload));
      ev.dataTransfer.setData('text/plain', payload.path);
      ev.dataTransfer.effectAllowed = 'copy';
    };
  });
}

// The drop target is wired here rather than in cardHtml, because cards are
// re-rendered on every poll and inline handlers would be lost.
function wireDrops(){
  document.querySelectorAll('[data-drop-card]').forEach(node => {
    node.ondragover = ev => { ev.preventDefault(); node.classList.add('drop'); };
    node.ondragleave = () => node.classList.remove('drop');
    node.ondrop = async ev => {
      ev.preventDefault(); node.classList.remove('drop');
      const raw = ev.dataTransfer.getData('text/hermes-path');
      let entry;
      try { entry = raw ? JSON.parse(raw) : { name:'dropped-file', path:ev.dataTransfer.getData('text/plain') }; }
      catch(e){ entry = { name:'dropped-file', path:'' }; }
      await attachToCard(node.dataset.dropCard, entry);
    };
  });
}

async function attachToCard(cardId, entry){
  const r = await fetch(`/api/attach/${encodeURIComponent(cardId)}`, {
    method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(entry)
  });
  const body = await r.json().catch(()=>({}));
  if (!r.ok){
    toast(`attach refused: ${body.detail || r.status}`, 'bad');
    return;
  }
  toast(`attached ${esc(entry.name)} to ${cardId}`, 'ok');
  await refresh();
  if (el('drawer').classList.contains('open')) openDrawer(cardId);
}

function toast(text, kind){
  const node = document.createElement('div');
  node.className = `toast ${kind||''}`;
  node.textContent = text;
  el('toasts').appendChild(node);
  setTimeout(() => node.remove(), 4000);
}

// --------------------------------------------------------- overlay
async function loadOverlay(){
  const d = await api('/api/overlay').catch(()=>({state:'alert', headline:'overlay unavailable', counters:{}, alerts:[]}));
  const c = d.counters || {};
  const cls = d.state === 'alert' ? 'alert' : (d.state === 'warn' ? 'warn' : 'ok');
  el('overlay').className = `overlay ${cls}`;
  el('overlay').innerHTML = `
    <div class="ov-head"><span class="dot ${d.state==='ok'?'ok':'bad'}"></span><b>${esc(d.state.toUpperCase())}</b>
      <span class="muted" style="margin-left:auto">${esc(d.headline||'')}</span></div>
    <div class="ov-counters">
      <span>cards <b>${c.cards||0}</b></span>
      <span>running <b>${c.running||0}</b></span>
      <span>blocked <b>${c.blocked||0}</b></span>
      <span>gates <b>${c.gates||0}</b></span>
      <span>tools <b>${c.tool_runs||0}</b></span>
      <span>routed <b>${d.routed_count||0}</b></span>
      ${c.cost_usd ? `<span>cost <b>$${Number(c.cost_usd).toFixed(4)}</b></span>` : ''}
    </div>
    ${(d.services||[]).map(s => `<div class="ov-alert ${s.state==='ok'?'':'alert'}">${esc(s.name)}: ${esc(s.detail||s.state)}</div>`).join('')}
    ${(d.alerts||[]).filter(a => a.severity !== 'ok').map(a => `<div class="ov-alert ${esc(a.severity)}">${esc(a.text)}</div>`).join('')}`;
}

// --------------------------------------------------- window manager
let WIN = { windows: [], stack: [], focused: null, taskbar: [] };

async function wmAction(action, payload){
  const r = await fetch('/api/windows', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ action, ...(payload||{}) })
  });
  const body = await r.json().catch(()=>({}));
  if (!r.ok){ toast(`window ${action} refused: ${body.detail||r.status}`, 'bad'); return; }
  WIN = body;
  renderWindows();
}

function renderWindows(){
  const max = el('desktop').clientHeight || 240;
  const maxW = el('desktop').clientWidth || 900;
  el('desktop').innerHTML = WIN.windows.map(w => {
    const b = w.bounds || {};
    const focused = w.id === WIN.focused;
    const style = `left:${b.x||0}px;top:${b.y||0}px;width:${Math.min(b.w||600,maxW)}px;height:${Math.min(b.h||240,max)}px`;
    return `<div class="win ${focused?'focused':''}" data-win="${esc(w.id)}" style="${style}">
      <div class="win-bar" data-drag="${esc(w.id)}"><span class="t">${esc(w.title||w.app)}</span>
        <span class="win-btn" data-wm="minimize" data-id="${esc(w.id)}" title="minimise">_</span>
        <span class="win-btn" data-wm="toggle_maximize" data-id="${esc(w.id)}" title="maximise">[]</span>
        <span class="win-btn" data-wm="close" data-id="${esc(w.id)}" title="close">x</span>
      </div>
      <div class="win-body">${esc(w.app)} &middot; ${esc(w.state)}</div></div>`;
  }).join('') || '<div class="muted" style="padding:10px">no windows - open one above</div>';

  el('wins').innerHTML = WIN.taskbar.map(t =>
    `<span class="winbtn ${t.focused?'active':''}" data-wm="focus" data-id="${esc(t.id)}">${esc(t.title||t.app)}</span>`
  ).join('');

  document.querySelectorAll('[data-wm]').forEach(n => n.onclick = ev => {
    ev.stopPropagation();
    wmAction(n.dataset.wm, { id:n.dataset.id });
  });
  document.querySelectorAll('.win').forEach(n => n.onmousedown = () => {
    if (n.dataset.win !== WIN.focused) wmAction('focus', { id:n.dataset.win });
  });
  // drag the title bar to move the window
  document.querySelectorAll('[data-drag]').forEach(bar => {
    bar.onmousedown = ev => {
      const id = bar.dataset.drag;
      const rect = el('desktop').getBoundingClientRect();
      const startX = ev.clientX, startY = ev.clientY;
      const win = WIN.windows.find(w => w.id === id);
      if (!win) return;
      const ox = win.bounds.x, oy = win.bounds.y;
      let moved = false;
      const onMove = e => {
        moved = true;
        const nx = Math.max(0, ox + (e.clientX - startX));
        const ny = Math.max(0, oy + (e.clientY - startY));
        const node = document.querySelector(`.win[data-win="${id}"]`);
        if (node){ node.style.left = nx + 'px'; node.style.top = ny + 'px'; }
      };
      const onUp = async e => {
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        if (moved){
          await wmAction('move', { id, x: Math.max(0, ox + (e.clientX - startX)), y: Math.max(0, oy + (e.clientY - startY)) });
        }
      };
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      ev.preventDefault();
      if (id !== WIN.focused) wmAction('focus', { id });
    };
  });
}

async function loadWindows(){
  WIN = await api('/api/windows').catch(()=>WIN);
  renderWindows();
}

document.querySelectorAll('[data-new]').forEach(b => b.onclick = () =>
  wmAction('open', { app:b.dataset.new, title:b.dataset.new }));

async function quickAdd(){
  const title = el('quick-title').value.trim();
  if(!title) return;
  await fetch(CFG.kanban_url+'/api/cards', {
    method:'POST', headers:{'content-type':'application/json'},
    body: JSON.stringify({ title, board_id: state.boardId, description:'created from the Hermes taskbar', priority:'medium' })
  });
  el('quick-title').value = '';
  await refresh();
}

async function refresh(){
  try { await Promise.all([loadBoards().then(loadBoard), loadOverview(), loadFeed(), pollHealth(), loadOverlay(), loadWindows()]); }
  catch(e){ console.error(e); }
}

el('d-close').onclick = () => el('drawer').classList.remove('open');
el('quick-add').onclick = quickAdd;
el('quick-title').addEventListener('keydown', ev => { if (ev.key === 'Enter') quickAdd(); });

(async () => {
  await fetchConfig();
  loadFileManager();
  await refresh();
  setInterval(refresh, Math.max(1000, CFG.poll_ms));
})();
