[pytest]
pythonpath = kanban-core agent-runtime tool-frontends observability hermes-shell board-ui memory-store
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    kanban-core/tests
    tool-frontends/tests
    observability/tests
    agent-runtime/tests
    board-ui/tests
    hermes-shell/tests
    memory-store/tests
addopts = -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
